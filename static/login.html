<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СтражСети — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-main: #0a0e1a;
            --bg-card: #0d1526;
            --bg-card-header: #0b1a30;
            --border-color: #1e3456;
            --text-primary: #e8edf5;
            --text-secondary: #8fa3c4;
            --text-muted: #5e7a9e;
            --accent: #22d3a7;
            --accent-glow: rgba(34, 211, 167, 0.25);
        }

        body {
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            margin: 0;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
        }

        .logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent), #2dd4bf);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1rem;
            flex-shrink: 0;
        }

        .logo i {
            color: #0a1628;
        }

        h2 {
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-label {
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 0.35rem;
            font-size: 0.9rem;
        }

        .form-control {
            background: #0b1120;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 0.5rem;
            padding: 0.7rem 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control::placeholder {
            color: #4a6282;
            opacity: 1;
        }

        .form-control:focus {
            background: #0b1120;
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent), #2dd4bf);
            color: #0a1628;
            font-weight: 700;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            border-radius: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .demo-hint {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(34, 211, 167, 0.06);
            border: 1px solid rgba(34, 211, 167, 0.2);
            border-radius: 0.5rem;
            text-align: center;
        }

        .demo-hint code {
            color: var(--accent);
            background: rgba(34, 211, 167, 0.1);
            padding: 0.15rem 0.5rem;
            border-radius: 0.3rem;
            font-weight: 600;
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.15em;
        }

        .footer-text {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 class="text-center">СтражСети</h2>
            <p class="subtitle text-center">Вход в панель мониторинга</p>

            <div id="errorAlert" class="alert alert-danger py-2" role="alert"></div>

            <form id="loginForm" autocomplete="off">
                <div class="mb-3">
                    <label for="username" class="form-label">Логин</label>
                    <input type="text" class="form-control" id="username" placeholder="demo" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" placeholder="••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="loginBtnText">Войти</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
            </form>

            <div class="demo-hint">
                <i class="bi bi-info-circle" style="color:var(--accent);"></i>
                <span style="color:var(--text-secondary);font-size:0.85rem;">
                    Демо-доступ: <code>demo</code> / <code>demo</code>
                </span>
            </div>
        </div>

        <div class="footer-text">
            Mesh-мониторинг и трекинг &middot; v2.0
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');
            const errorAlert = document.getElementById('errorAlert');

            if (!username || !password) {
                showError('Пожалуйста, введите логин и пароль');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Вход...';
            spinner.classList.remove('d-none');
            errorAlert.style.display = 'none';

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await resp.json();

                if (resp.ok && data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Неверный логин или пароль');
                }
            } catch (err) {
                showError('Ошибка соединения с сервером');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Войти';
                spinner.classList.add('d-none');
            }
        });

        function showError(msg) {
            const el = document.getElementById('errorAlert');
            el.textContent = msg;
            el.style.display = 'block';
        }

        // Auto-focus username
        document.getElementById('username').focus();

        // Pre-fill demo credentials (optional hint)
        if (!document.getElementById('username').value) {
            document.getElementById('username').value = 'demo';
            document.getElementById('password').focus();
        }
    </script>
</body>
</html>
