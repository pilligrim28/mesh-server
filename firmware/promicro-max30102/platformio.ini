; Arduino Pro Micro (ATmega32U4) + MAX30102 → USB COM-порт → приложение pulse-com
; Arduino IDE: плата «Arduino Leonardo» (5V/16 МГц) или «SparkFun Pro Micro 3.3V/8MHz»,
;              библиотека «SparkFun MAX3010x Pulse and Proximity Sensor Library», файл src/main.cpp → .ino
[env:promicro16]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
monitor_speed = 115200
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:promicro8]
platform = atmelavr
board = sparkfun_promicro8
framework = arduino
monitor_speed = 115200
lib_deps = sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
