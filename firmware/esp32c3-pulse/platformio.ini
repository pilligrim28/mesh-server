; Прошивка носимого датчика: ESP32-C3 + MAX30102 -> BLE -> узел Meshtastic (Heltec V3)
; Сборка:   pio run            Прошивка:  pio run -t upload      Лог:  pio device monitor

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1          ; лог через встроенный USB (ESP32-C3 SuperMini)
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
