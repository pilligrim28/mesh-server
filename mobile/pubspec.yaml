name: mesh_mobile
description: Мобильное приложение для отслеживания сотрудников через Bluetooth LE
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP и WebSocket
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  
  # Bluetooth LE
  flutter_blue_plus: ^1.31.0
  
  # Карта
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Локальная база данных
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # State Management
  provider: ^6.1.1
  
  # Утилиты
  uuid: ^4.2.1
  intl: ^0.18.1
  permission_handler: ^11.1.0
  geolocator: ^10.1.0
  
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
