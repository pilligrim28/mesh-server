; PlatformIO Project Configuration
; СтражСети Hub Firmware
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio

; Библиотеки
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Компиляция
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; OTA
upload_protocol = esptool

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:esp32_lora]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    jgromes/RadioLib@^6.0.0

build_flags =
    -DLORA_ENABLED=1
    -DCORE_DEBUG_LEVEL=1
