<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Mesh Pulse</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head>
<body><div class="login-wrap"><form class="login" id="f">
<img src="/favicon.svg" alt=""><h1>Mesh Pulse</h1><p class="muted">Мониторинг пульса через Meshtastic</p>
<label for="u">Логин</label><input id="u" autocomplete="username" required autofocus>
<label for="p">Пароль</label><input id="p" type="password" autocomplete="current-password" required>
<button class="btn primary" id="b">Войти</button><div class="err" id="e"></div>
</form></div>
<script>
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.style.display = 'none';
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: u.value.trim(), password: p.value})});
    if (r.ok) { location.replace('/'); return; }
    e.textContent = (await r.json()).error || 'Ошибка входа';
  } catch { e.textContent = 'Сервер недоступен'; }
  e.style.display = 'block'; b.disabled = false;
});
</script></body></html>
